
name: Deploy React App to GitHub Pages

on:
  push:
    branches: ["main"] 

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 自動テストを実行
      - name: Run Tests
        run: npm run test

      #　自動テストが通ったらビルド
      - name: Build Project
        run: npm run build

      # ビルドが成功したらGitHub Pagesにデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist